<script>
// Initialize Supabase Client
const SUPABASE_URL = 'https://xdcjdpyuvalqpivduhsf.supabase.co';
const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_fxcd-0JYlGSOjBE1B74A2Q_3zRZYdlN';
const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

let currentUser = null, currentRole = 'trainer';
let state = { folders: [], items: [] }, nav = 'dashboard', folder = null, search = '', pendingFiles = [];

function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[c])) }
function closeM(id) { document.getElementById(id).style.display = 'none' }
function toast(x) { let t = document.getElementById('toast'); t.textContent = x; t.style.display = 'block'; setTimeout(() => t.style.display = 'none', 1800) }
function fileIcon(n) { let e = n.split('.').pop().toLowerCase(); return ['mp4', 'webm', 'mov', 'mkv'].includes(e) ? '🎥' : ['mp3', 'wav', 'm4a', 'ogg'].includes(e) ? '🎧' : ['pdf'].includes(e) ? '📕' : ['doc', 'docx'].includes(e) ? '📘' : ['ppt', 'pptx'].includes(e) ? '📊' : ['xls', 'xlsx', 'csv'].includes(e) ? '📗' : ['jpg', 'jpeg', 'png', 'webp'].includes(e) ? '🖼️' : '📄' }
function fmtBytes(n) { if (!n) return ''; let u = ['B', 'KB', 'MB', 'GB']; let i = Math.floor(Math.log(n) / Math.log(1024)); return (n / 1024 ** i).toFixed(i ? 1 : 0) + ' ' + u[i] }

// Check Active Session on Startup
async function checkAuth() {
  const { data: { session } } = await _supabase.auth.getSession();
  if (!session) {
    document.getElementById('loginModal').style.display = 'flex';
    return;
  }
  currentUser = session.user;
  document.getElementById('userEmailDisplay').textContent = currentUser.email;
  
  // Safely fetch user role without 406 error
  let { data: profile } = await _supabase.from('profiles').select('role').eq('id', currentUser.id).limit(1);
  if (profile && profile.length > 0) {
    currentRole = profile[0].role;
  }
  document.getElementById('userRoleDisplay').textContent = currentRole.toUpperCase();
  
  document.getElementById('loginModal').style.display = 'none';
  load();
}

// Handle Login Submission
document.getElementById('loginForm').onsubmit = async e => {
  e.preventDefault();
  let email = document.getElementById('loginEmail').value.trim();
  let password = document.getElementById('loginPassword').value;

  let { data, error } = await _supabase.auth.signInWithPassword({ email, password });
  if (error) {
    alert('Login failed: ' + error.message);
    return;
  }
  toast('Signed in successfully!');
  checkAuth();
};

async function logout() {
  await _supabase.auth.signOut();
  window.location.reload();
}

// Load Folders and Materials from Supabase Cloud Database
async function load() {
  try {
    let { data: folders, error: fErr } = await _supabase.from('folders').select('*');
    if (fErr) throw fErr;

    if (!folders || folders.length === 0) {
      const defaultFolders = [
        { name: 'General' },
        { name: 'PowerCARD' },
        { name: 'Payments' },
        { name: 'Trust & Safety' },
        { name: 'Onboarding' }
      ];
      let { data: newF, error: insErr } = await _supabase.from('folders').insert(defaultFolders).select();
      if (!insErr) folders = newF;
    }
    state.folders = folders || [];

    // Fetch materials and files separately to ensure robust compatibility
    let { data: materials, error: mErr } = await _supabase.from('training_materials').select('*');
    if (mErr) throw mErr;

    let { data: files, error: fileErr } = await _supabase.from('material_files').select('*');
    if (fileErr) console.warn('Files fetch warning:', fileErr);

    state.items = (materials || []).map(m => {
      let mFiles = (files || []).filter(f => f.material_id === m.id);
      return {
        id: m.id,
        title: m.title,
        folderId: m.folder_id,
        description: m.description,
        keywords: m.keywords || '',
        time: m.time || '',
        version: m.current_version || '',
        assessment: m.assessment || '',
        en: m.en_link || '',
        fr: m.fr_link || '',
        dataset: m.dataset || '',
        onepager: m.onepager || '',
        favorite: m.favorite || false,
        files: mFiles.map(f => ({ id: f.id, name: f.file_name, path: f.file_path, size: f.file_size || 0 }))
      };
    });

    render();
  } catch (err) {
    console.error('Error loading data from Supabase:', err);
    toast('Error connecting to cloud database');
  }
}

function filtered() {
  let q = search.toLowerCase();
  return state.items.filter(x => (!folder || x.folderId == folder) && (!q || [x.title, x.description, x.keywords, x.version, x.assessment, x.dataset].join(' ').toLowerCase().includes(q)) && (nav !== 'favorites' || x.favorite));
}

function render() {
  document.querySelectorAll('[data-nav]').forEach(b => b.classList.toggle('on', b.dataset.nav === nav));
  let title = folder ? (state.folders.find(f => f.id == folder)?.name || 'Folder') : (nav === 'folders' ? 'Training folders' : nav === 'materials' ? 'All materials' : nav === 'favorites' ? 'Favorites' : 'Training Dashboard');
  document.getElementById('title').textContent = title;
  document.getElementById('subtitle').textContent = folder ? `${filtered().length} training section(s)` : 'Organize complete training courses and resources online.';
  
  if (nav === 'folders' && !folder) return renderFolders();
  if (nav === 'dashboard' && !folder) return renderDashboard();
  renderItems();
}

function renderDashboard() {
  let v = state.items;
  let totalFiles = v.reduce((a, x) => a + x.files.length, 0);
  document.getElementById('view').innerHTML = `
    <div class="stats">
      <div class="stat"><small>Training sections</small><b>${v.length}</b></div>
      <div class="stat"><small>Folders</small><b>${state.folders.length}</b></div>
      <div class="stat"><small>Cloud files</small><b>${totalFiles}</b></div>
      <div class="stat"><small>Favorites</small><b>${v.filter(x => x.favorite).length}</b></div>
    </div>
    <div class="toolbar"><button class="btn primary" onclick="openMaterial()">＋ Add training section</button></div>
    <div class="grid">${v.slice(0, 8).map(card).join('') || empty()}</div>`;
  bindCards();
}

function renderFolders(){
  document.getElementById('view').innerHTML = `
    <div class="folders">
      ${state.folders.map(f => `
        <div class="folder" onclick="openFolder('${f.id}')" style="position:relative;">
          <b>▰ ${esc(f.name)}</b>
          <small>${state.items.filter(x => x.folderId == f.id).length} section(s)</small>
          <div style="position:absolute; top:12px; right:12px; display:flex; gap:5px;">
            <button class="small" onclick="event.stopPropagation(); editFolder('${f.id}', '${esc(f.name)}')">✏️ Edit</button>
            <button class="small" onclick="event.stopPropagation(); deleteFolder('${f.id}', '${esc(f.name)}')">🗑️️</button>
          </div>
        </div>
      `).join('')}
    </div>`;
}

async function editFolder(id, currentName) {
  let newName = prompt('Edit folder name:', currentName);
  if (!newName || !newName.trim()) return;
  let { error } = await _supabase.from('folders').update({ name: newName.trim() }).eq('id', id);
  if (error) { toast('Error updating folder'); } else { toast('Folder updated'); await load(); }
}

async function deleteFolder(id, name) {
  if (!confirm(`Delete folder "${name}"? Materials inside will be unassigned.`)) return;
  let { error } = await _supabase.from('folders').delete().eq('id', id);
  if (error) { toast('Error deleting folder'); } else { toast('Folder deleted'); await load(); }
}

function renderItems() {
  let a = filtered();
  document.getElementById('view').innerHTML = `
    <div class="toolbar">
      <select id="folderFilter"><option value="">All folders</option>${state.folders.map(f => `<option value="${f.id}" ${folder == f.id ? 'selected' : ''}>${esc(f.name)}</option>`).join('')}</select>
      <span class="muted">${a.length} result(s)</span>
    </div>
    <div class="grid">${a.map(card).join('') || empty()}</div>`;
  document.getElementById('folderFilter').onchange = e => { folder = e.target.value || null; nav = 'materials'; render(); };
  bindCards();
}

function empty() {
  return `<div class="empty">No training sections found.<br><button class="btn primary" style="margin-top:12px" onclick="openMaterial()">＋ Add training section</button></div>`;
}

function card(x) {
  let f = state.folders.find(f => f.id == x.folderId);
  return `
    <div class="card">
      <div class="icon">${x.files.length ? '📚' : '📝'}</div>
      <h3 title="${esc(x.title)}">${esc(x.title)}</h3>
      <div class="muted">${esc(f?.name || 'Folder')} · ${esc(x.time || 'Time not set')}</div>
      <div class="tags">${(x.keywords || '').split(',').filter(Boolean).slice(0, 5).map(t => `<span class="tag">${esc(t.trim())}</span>`).join('')}</div>
      <div class="muted">${esc(x.description || 'No description')}</div>
      <div class="actions">
        <button class="small" data-open="${x.id}">Open</button>
        <button class="small" data-fav="${x.id}">${x.favorite ? '★' : '☆'}</button>
        <button class="small" data-del="${x.id}">Delete</button>
      </div>
    </div>`;
}

function bindCards() {
  document.querySelectorAll('[data-open]').forEach(b => b.onclick = () => detail(b.dataset.open));
  document.querySelectorAll('[data-fav]').forEach(b => b.onclick = async () => {
    let x = state.items.find(x => x.id == b.dataset.fav);
    x.favorite = !x.favorite;
    await _supabase.from('training_materials').update({ favorite: x.favorite }).eq('id', x.id);
    await load();
  });
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => {
    if (confirm('Delete this training section and its cloud records?')) {
      await _supabase.from('training_materials').delete().eq('id', b.dataset.del);
      await load();
      toast('Deleted');
    }
  });
}

function openFolder(id) { folder = id; nav = 'materials'; render(); }

async function openMaterial() {
  pendingFiles = [];
  document.getElementById('materialForm').reset();
  document.getElementById('mFolder').innerHTML = state.folders.map(f => `<option value="${f.id}">${esc(f.name)}</option>`).join('');
  if (folder) document.getElementById('mFolder').value = folder;
  document.getElementById('fileList').innerHTML = '';
  document.getElementById('materialModal').style.display = 'flex';
}

function detail(id) {
  let x = state.items.find(x => x.id === id), f = state.folders.find(f => f.id == x.folderId);
  document.getElementById('title').textContent = x.title;
  document.getElementById('subtitle').textContent = f?.name || '';
  document.getElementById('view').innerHTML = `
    <div class="detail">
      <div>
        <div class="section">
          <h3>Description</h3>
          <div>${esc(x.description || '—').replace(/\n/g, '<br>')}</div>
        </div>
        <div class="section">
          <h3>Resources & files</h3>
          ${x.files.map((z) => `<div class="resource"><span>${fileIcon(z.name)}${esc(z.name)}</span><button class="small" onclick="downloadCloudFile('${z.path}')">Open / download</button></div>`).join('') || '<div class="muted">No files stored.</div>'}
        </div>
      </div>
      <div>
        <div class="section">
          <h3>Training specification</h3>
          <div class="kv"><b>Keywords</b><span>${esc(x.keywords || '—')}</span></div>
          <div class="kv"><b>Estimated time</b><span>${esc(x.time || '—')}</span></div>
          <div class="kv"><b>PowerCARD Version</b><span>${esc(x.version || '—')}</span></div>
          <div class="kv"><b>Assessment</b><span>${esc(x.assessment || '—')}</span></div>
          <div class="kv"><b>eAcademy EN</b><span>${x.en ? `<a href="${esc(x.en)}" target="_blank">Open EN</a>` : '—'}</span></div>
          <div class="kv"><b>eAcademy FR</b><span>${x.fr ? `<a href="${esc(x.fr)}" target="_blank">Open FR</a>` : '—'}</span></div>
        </div>
        <button class="btn" onclick="render()">← Back</button>
      </div>
    </div>`;
}

async function downloadCloudFile(filePath) {
  const { data, error } = _supabase.storage.from('training-files').getPublicUrl(filePath);
  if (error) { toast('Could not retrieve file URL'); return; }
  window.open(data.publicUrl, '_blank');
}

document.querySelectorAll('[data-nav]').forEach(b => b.onclick = () => { nav = b.dataset.nav; folder = null; render(); });
document.getElementById('search').oninput = e => { search = e.target.value; render(); };
document.getElementById('folderBtn').onclick = () => document.getElementById('folderModal').style.display = 'flex';
document.getElementById('materialBtn').onclick = openMaterial;

document.getElementById('createFolder').onclick = async () => {
  let n = document.getElementById('folderName').value.trim();
  if (!n) return;
  if (state.folders.some(f => f.name.toLowerCase() === n.toLowerCase())) return toast('Folder already exists');
  let { error } = await _supabase.from('folders').insert([{ name: n }]);
  if (error) return toast('Error creating folder');
  closeM('folderModal');
  await load();
  toast('Folder created');
};

document.getElementById('fileBox').onclick = () => document.getElementById('files').click();
document.getElementById('files').onchange = e => {
  pendingFiles = [...e.target.files];
  document.getElementById('fileList').innerHTML = pendingFiles.map(f => `📎 ${esc(f.name)} — ${fmtBytes(f.size)}`).join('<br>');
};

document.getElementById('materialForm').onsubmit = async e => {
  e.preventDefault();
  toast('Saving material and uploading files...');

  let { data: matData, error: matErr } = await _supabase.from('training_materials').insert([{
    title: document.getElementById('mTitle').value.trim(),
    folder_id: document.getElementById('mFolder').value,
    description: document.getElementById('mDesc'].value,
    keywords: document.getElementById('mKeywords'].value,
    time: document.getElementById('mTime'].value,
    current_version: document.getElementById('mVersion').value,
    assessment: document.getElementById('mAssessment').value,
    en_link: document.getElementById('mEn'].value,
    fr_link: document.getElementById('mFr'].value,
    dataset: document.getElementById('mDataset'].value,
    onepager: document.getElementById('mOne'].value,
    status: 'published'
  }]).select().single();

  if (matErr) {
    console.error(matErr);
    return toast('Error saving training material');
  }

  const materialId = matData.id;

  for (let file of pendingFiles) {
    let filePath = `materials/${materialId}/${Date.now()}_${file.name}`;
    let { error: uploadErr } = await _supabase.storage.from('training-files').upload(filePath, file);

    if (!uploadErr) {
      await _supabase.from('material_files').insert([{
        material_id: materialId,
        file_name: file.name,
        file_path: filePath,
        file_size: file.size
      }]);
    }
  }

  closeM('materialModal');
  await load();
  toast('Training section saved to cloud!');
};

checkAuth();
</script>
